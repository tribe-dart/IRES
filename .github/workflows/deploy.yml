name: Deploy IRES to AWS S3 & CDN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Deploy Static Assets (CSS, JS, Fonts, Images) with Cache
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME || 'iresglobal.com' }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "infra/*" \
            --exclude "tmp/*" \
            --exclude "*.md" \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Deploy HTML Files (No Cache for Instant Updates)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME || 'iresglobal.com' }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache (Optional)
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
