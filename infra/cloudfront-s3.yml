AWSTemplateFormatVersion: '2010-09-09'
Description: 'IRES Frontend S3 Bucket and CloudFront Distribution with OAC & Custom Domain'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'production'
    Description: 'Deployment environment'

  DomainName:
    Type: String
    Default: 'iresglobal.com'
    Description: 'Apex domain name (e.g. iresglobal.com)'

  AlternativeDomainName:
    Type: String
    Default: 'www.iresglobal.com'
    Description: 'Alternative domain name (e.g. www.iresglobal.com)'

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: 'ARN of the ACM SSL Certificate in us-east-1 (leave blank to use default cloudfront.net certificate)'

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref AcmCertificateArn, '']]

Resources:
  # 1. Private S3 Bucket for Static Assets
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'iresglobal-frontend-cf-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: IRES
        - Key: Environment
          Value: !Ref EnvironmentName

  # 2. CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ires-oac-${AWS::AccountId}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 3. CloudFront Function: Canonical 301 Redirect from www to apex domain
  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'ires-www-redirect-${AWS::AccountId}'
      AutoPublish: true
      FunctionConfig:
        Comment: 'Redirect www to apex domain'
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = (request.headers.host && request.headers.host.value) || '';
          if (host.startsWith('www.')) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                'location': { value: 'https://' + host.slice(4) + request.uri }
              }
            };
          }
          return request;
        }

  # 4. CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'IRES Frontend Distribution (${EnvironmentName})'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If
          - HasCustomDomain
          - - !Ref DomainName
            - !Ref AlternativeDomainName
          - !Ref 'AWS::NoValue'
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: IresS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: IresS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Project
          Value: IRES
        - Key: Environment
          Value: !Ref EnvironmentName

  # 5. S3 Bucket Policy allowing CloudFront OAC read access
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

Outputs:
  BucketName:
    Description: 'S3 Bucket Name for IRES Frontend'
    Value: !Ref FrontendBucket
    Export:
      Name: IresCfBucketName

  DistributionId:
    Description: 'CloudFront Distribution ID'
    Value: !Ref CloudFrontDistribution
    Export:
      Name: IresDistributionId

  DistributionDomainName:
    Description: 'CloudFront Distribution Domain Name (use this for DNS CNAME/ALIAS)'
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: IresDistributionDomainName

  DistributionURL:
    Description: 'CloudFront HTTPS Endpoint'
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  CustomDomainURL:
    Condition: HasCustomDomain
    Description: 'Custom Domain HTTPS Endpoint'
    Value: !Sub 'https://${DomainName}'
