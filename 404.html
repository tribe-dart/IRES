<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1410" />
    <title>Page Not Found — IRES</title>
    <meta name="description" content="Innovative Rammed Earth Solutions" />
    <link rel="icon" href="assets/logo/Ires%20icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .error-hero {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 4rem 1.5rem;
      }
      .error-code {
        font-family: var(--font-display, 'Fraunces', serif);
        font-size: clamp(4rem, 10vw, 8rem);
        color: var(--color-earth, #a96e49);
        margin: 0;
        line-height: 1;
      }
      .error-title {
        font-family: var(--font-display, 'Fraunces', serif);
        font-size: clamp(1.5rem, 3vw, 2.5rem);
        margin: 1rem 0 1.5rem;
      }
      .error-text {
        max-width: 480px;
        color: var(--color-muted, #7c7267);
        margin-bottom: 2rem;
      }
      .error-btn {
        display: inline-block;
        padding: 0.85rem 1.75rem;
        background-color: var(--color-earth, #a96e49);
        color: #ffffff;
        text-decoration: none;
        border-radius: 999px;
        font-weight: 500;
        transition: opacity 0.2s ease;
      }
      .error-btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <header class="site-header" id="site-header">
      <a class="brand" href="/" aria-label="IRES, home">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/logo/Ires-icon.png" alt="" width="266" height="270" />
        </span>
        <span class="brand-word">
          <strong>IRES</strong>
          <small>Innovative Rammed Earth Solutions</small>
        </span>
      </a>
      <a class="nav-cta" href="/">Return home</a>
    </header>

    <main id="main">
      <section class="error-hero">
        <p class="error-code">404</p>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-text">
          The page you are looking for doesn't exist or may have been moved.
        </p>
        <a class="error-btn" href="/">Back to Homepage</a>
      </section>
    </main>

    <footer class="site-footer">
      <span class="footer-bands" aria-hidden="true">
        <img src="assets/logo/Ires-icon.png" alt="" width="266" height="270" />
      </span>
      <p class="footer-line">Innovative Rammed Earth Solutions — earth and engineering, built as one.</p>
    </footer>
  </body>
</html>
