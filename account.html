<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1410" />
    <title>Account — IRES</title>
    <meta name="description" content="Create an IRES account, confirm your email, and open the CRM." />
    <link rel="icon" href="assets/logo/Ires%20icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=2.3" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header is-stuck" id="site-header">
      <a class="brand" href="index.html" aria-label="IRES, home">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/logo/Ires%20icon.svg" alt="" width="36" height="36" style="width: 36px; height: 36px; max-width: 36px; max-height: 36px; object-fit: contain; display: block;" />
        </span>
        <span class="brand-word">
          <strong>IRES</strong>
          <small>Innovative Rammed Earth Solutions</small>
        </span>
      </a>
      <a class="nav-cta" href="index.html">Back to the site</a>
    </header>

    <main id="main" class="legal">
      <p class="eyebrow">Account</p>
      <h1 id="account-title">Create your IRES account.</h1>
      <p id="account-copy">Confirm the email we send you. Then you can open the CRM or stay on the website. It is the same login either way.</p>

      <form class="contact-form" id="account-form">
        <div class="field" id="name-field">
          <label for="account-name">Name</label>
          <input id="account-name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="account-email">Email</label>
          <input id="account-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="account-password">Password</label>
          <input id="account-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" id="account-submit">Create account</button>
        <p class="form-status" id="account-status" role="status"></p>
        <p><button type="button" id="account-switch" class="text-button">I already have an account</button></p>
        <p id="crm-link" hidden><a href="https://crm.iresglobal.com">Go to the CRM</a></p>
      </form>
    </main>

    <footer class="site-footer">
      <p class="footer-line">Innovative Rammed Earth Solutions. Earth becomes home.</p>
    </footer>
    <script src="account.js?v=1"></script>
  </body>
</html>
